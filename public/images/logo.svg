<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" width="200" height="56" fill="none">
  <defs>
    <!-- Accent Gradient for Text 'Flow' -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Gradient for Shield/Check Badge -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gradient for Left Bar 1 -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Gradient for Left Bar 2 -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter for Shield -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO ICON GROUP -->
  <g transform="translate(4, 2)">
    <!-- Outer Orbit Curves -->
    <path d="M 6 22 A 22 22 0 0 1 42 10" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
    <path d="M 46 30 A 22 22 0 0 1 10 42" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />

    <!-- Left Bar 1 (Short) -->
    <rect x="6" y="18" width="8" height="18" rx="4" fill="url(#bar1Grad)" stroke="#93c5fd" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Left Bar 2 (Tall) -->
    <rect x="17" y="12" width="8" height="28" rx="4" fill="url(#bar2Grad)" stroke="#a5b4fc" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Right Shield / Play Badge with Checkmark -->
    <path d="M 28 12 C 28 10, 31 9, 33 10.5 L 47 21 C 49 22.5, 49 25.5, 47 27 L 33 37.5 C 31 39, 28 38, 28 36 Z" 
          fill="url(#shieldGrad)" 
          fill-opacity="0.8"
          stroke="#5eead4" 
          stroke-width="1.2"
          filter="url(#glow)" />

    <!-- Checkmark inside Shield -->
    <path d="M 33 24.5 L 36.5 28 L 43 20" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- LOGO TEXT GROUP -->
  <g transform="translate(68, 0)">
    <!-- "Job Flow" Title -->
    <text x="0" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="25" letter-spacing="-0.3">
      <tspan fill="#ffffff">Job </tspan>
      <tspan fill="url(#flowGrad)">Flow</tspan>
    </text>

    <!-- "JOB SEARCH TRACKER" Subtitle -->
    <text x="1" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="7.5" fill="#94a3b8" letter-spacing="2.2">
      JOB SEARCH TRACKER
    </text>
  </g>
</svg>
